# quality creative x target targeting.
# Identical to scenario_noad.yaml except for the ad_campaigns block below.

seed: 42  # Same seed in all scenarios => the same 8 people, same starting spots

simulation:
  duration: 24
  half_space_size: 9    # 1 cell/step: far enough that the ad lands before most people shop
  half_place_size: 2

agents:
  num_agents: 12
  communication_radius: 5
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  # Handed out in agent-id order, so agent 3 is the same person in every scenario
  budgets: [4, 4, 5, 5, 6, 6, 7, 8, 8, 9, 10, 12]

  # Dispositions, not instructions. Nothing here says which advertisement ought
  # to work; that is what the run is for. Without any disposition at all, two
  # creatives could only differ by sampling noise.
  personas:
    - "You care most about price and will compromise elsewhere to save money."
    - "You judge things by how they are made; cheapness on its own does not convince you."
    - "You like what is new and being talked about."
    - "You dislike making mistakes and want to know what others think before deciding."
    - "You decide quickly once you have made up your mind and dislike deliberating."
    - "You are wary of advertising and would rather find things for yourself."

  # Who each agent already knows, by agent id. Whether a familiar voice carries
  # more weight than a stranger's is left to the LLM; only the fact is given.
  relations:
    - [1, 6]
    - [0, 2]
    - [1, 7]
    - [4, 9]
    - [3, 5]
    - [4, 10]
    - [0, 7]
    - [2, 6]
    - [9, 11]
    - [3, 8]
    - [5, 11]
    - [8, 10]

  # The step from which each agent is in the market. Real demand does not all
  # arrive on day one, and a campaign needs someone left to influence.
  active_from: [1, 1, 2, 3, 4, 5, 6, 8, 9, 11, 13, 15]

places:
  - name: "brandco"
    type: "store"
    center_x: -5
    center_y: 0
    half_size: 2
    capacity: 8
    stock: 4      # Deliberately scarce: the advertised shelf can actually empty
    price: 5
  - name: "rival"
    type: "store"
    center_x: 5
    center_y: 0
    half_size: 2
    capacity: 8
    stock: 5
    price: 4

ad_campaigns:
  - name: "quality_target"
    sponsor: "BrandCo"
    copy: "BrandCo tote. Hand-finished leather, made to last ten years."
    place: "brandco"        # what the ad links to; a click lands here
    start_step: 4
    end_step: 9
    targeting: in_market    # Only agents already close to buying
    targeting_radius: 5

llm:
  model: "qwen3:4b-instruct-2507-q4_K_M"
  base_url: "http://localhost:11434"
  temperature: 0.2
  seed: 42
  think: false
  max_tokens: 512
  timeout: 300
  repeat_penalty: 1.1
  repeat_last_n: 128
  min_p: 0.05

visualization:
  save_frames: true
  frame_interval: 1
  output_dir: "output_quality_target_s42"

logging:
  level: "INFO"
  log_file: "simulation_quality_target_s42.log"
